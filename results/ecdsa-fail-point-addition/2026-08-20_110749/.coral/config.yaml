task:
  name: ECDSA Fail Point Addition
  description: "Build the cheapest reversible quantum circuit that performs one elliptic-curve\n\
    point addition on secp256k1. This is the ecdsa.fail challenge\n(https://github.com/Layr-Labs/ecdsafail-challenge)\
    \ \u2014 the repo you are in is a\nclone of it, and the grader runs its `./benchmark.sh`\
    \ exactly as the platform does.\n\nThe harness calls `point_add::build()`, which\
    \ must consume four 256-element\nregisters \u2014 `target_x`, `target_y` (qubits),\
    \ `offset_x`, `offset_y` (classical\nbits) \u2014 and overwrite `(target_x, target_y)`\
    \ with the affine sum\n`(target_x, target_y) + (offset_x, offset_y)` on secp256k1.\n\
    \nScore = (average executed Toffoli count per shot) x (peak live qubits).\n**Lower\
    \ is better.** The platform's current best is ~1.48e9\n(toffoli 1,284,776 x 1,150\
    \ qubits). The seed is that exact circuit, so every\nimprovement you find is a\
    \ new world record candidate.\n\nA run is REJECTED (scores as a failure) if any\
    \ of these fail across 9024\nFiat-Shamir-derived random test points: classical\
    \ correctness, every ancilla\nuncomputed to |0> before free, zero global phase,\
    \ and forward\u2218reverse = identity.\nThere are no loopholes \u2014 skipping\
    \ uncomputation or leaking phase fails the run.\n\n**You may only edit files under\
    \ `src/point_add/`.** Anything else \u2014 `src/main.rs`,\n`src/circuit.rs`, `src/sim.rs`,\
    \ `src/weierstrass_elliptic_curve.rs`, `Cargo.toml`,\n`Cargo.lock`, `rust-toolchain`,\
    \ `benchmark.sh`, `setup.sh` \u2014 is the contract. The\ngrader diffs your commit\
    \ against `main` and fails any attempt that touches a\nnon-editable path, because\
    \ ecdsa.fail would reject it anyway.\n\nStart by reading `src/point_add/memory/README.md`\
    \ and `06-research-status.md`:\nprevious solvers left a detailed map of the architecture,\
    \ proven floors, traps,\nand open problems. Treat them as leads, not gospel \u2014\
    \ verify before relying on them.\nKeep `src/point_add/memory/` up to date with\
    \ what you learn; it ships with the\nsubmission and is how the ecdsa.fail solver\
    \ swarm shares knowledge.\n"
  tips: "- Eval timeout is 1800s. A full 9024-shot run takes ~1-3 minutes on a laptop\
    \ after\n  the first build; the grader shares a cargo target dir across evals\
    \ so only\n  `point_add` recompiles.\n- Iterate locally before `coral eval`: `cargo\
    \ run --release -- --note \"what I tried\"`\n  builds, validates, scores, and\
    \ appends to results.tsv. `cargo build --release`\n  alone catches type errors\
    \ in seconds.\n- Only a byte-identical ops.bin or a full 9024-shot run counts\
    \ as evidence \u2014 a\n  healthy peak/Toffoli probe on a partial run proves nothing\
    \ (see memory/04-traps.md).\n- The score is a PRODUCT: a 1% qubit cut is worth\
    \ the same as a 1% Toffoli cut.\n  Watch for the exchange-rate trap described\
    \ in memory/05-qubit-reduction.md \u2014\n  freed qubits get re-absorbed unless\
    \ you also lower the matching target knob.\n- Google's published Pareto points\
    \ are ~3.0-3.2e9; the seed is already ~2x below\n  them. Gains now come from modular-inverse\
    \ structure, windowed arithmetic,\n  carry-lookahead vs ripple trade-offs, measurement-based\
    \ uncomputation, and\n  better ancilla scheduling \u2014 not from micro-optimising\
    \ gate counts by hand.\n- Write `coral eval -m` messages and notes as if for another\
    \ solver: what you\n  changed, the measured toffoli/qubits, and why it did or\
    \ didn't help.\n"
grader:
  entrypoint: ecdsa_fail_grader.grader:Grader
  setup:
  - uv pip install -e ./grader
  timeout: 1800
  args:
    editable_paths:
    - src/point_add
    base_ref: main
    benchmark_command: bash -lc ./benchmark.sh
    reference_best: 1477492400
  private: []
  direction: minimize
  max_pending_per_agent: 1
  parallel:
    max_workers: 1
agents:
  count: 1
  runtime: pi
  model: openai/gpt-5.3-codex
  gateway:
    enabled: false
    port: 4000
    config: ''
    api_key: ''
  warmstart:
    enabled: false
  runtime_options: {}
  isolate_user: ''
  sandbox:
    enabled: false
    provider: srt
    network: open
    srt_command:
    - npx
    - --no-install
    - srt
    allowed_domains: []
    deny_read: []
    allow_read: []
    allow_write: []
    extra_settings: {}
  assignments: []
  max_turns: 0
  timeout: 1200
  heartbeat:
  - name: reflect
    every: 1
    trigger: interval
    prompt: ''
    options: {}
    global: false
  - name: consolidate
    every: 10
    trigger: interval
    prompt: ''
    options: {}
    global: true
  - name: pivot
    every: 5
    trigger: plateau
    prompt: ''
    options: {}
    global: false
  - name: lint_wiki
    every: 10
    trigger: interval
    prompt: ''
    options: {}
    global: true
  skills: []
  research: true
  stagger_seconds: 0
  restart_burst_threshold: 3
  restart_burst_window: 30
  restart_pause_seconds: 300
  grader_pending_max_age: 1800
  min_clean_runtime_seconds: 60
islands:
  count: 1
  migration:
    enabled: true
    every: 50
    rank_window: 20
    min_evals: 3
    dest_weighting: weakest
    max_per_cycle: 2
    remigration_cooldown: 100
    notify_island: true
    resync_bystanders: true
sharing:
  attempts: true
  notes: true
  skills: true
workspace:
  results_dir: ./results
  repo_path: ./seed
  setup:
  - bash -lc 'cargo build --release --locked --offline --bin build_circuit --bin eval_circuit'
  base_dir: ''
  run_dir: ''
run:
  verbose: false
  ui: false
  session: local
  docker_image: ''
  stop:
    score_threshold: null
    max_real_attempts: null
