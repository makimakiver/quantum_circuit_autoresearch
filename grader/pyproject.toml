[project]
name = "ecdsa-fail-grader"
version = "0.1.0"
description = "CORAL grader for the ecdsa.fail secp256k1 point-addition challenge."
requires-python = ">=3.11"
dependencies = ["coral"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecdsa_fail_grader"]
