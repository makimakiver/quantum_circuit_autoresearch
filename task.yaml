# ecdsa.fail — secp256k1 quantum point-addition challenge, driven by CORAL.
#
# Seed = a clone of Layr-Labs/ecdsafail-challenge (run ./bootstrap.sh first).
# Grader = the challenge's own ./benchmark.sh; score = toffoli x qubits (lower wins).
# When a CORAL attempt beats the leaderboard, push it upstream with
# ./scripts/submit_attempt.sh <hash> (wraps `ecdsafail submit`).

task:
  name: "ECDSA Fail Point Addition"
  description: |
    Build the cheapest reversible quantum circuit that performs one elliptic-curve
    point addition on secp256k1. This is the ecdsa.fail challenge
    (https://github.com/Layr-Labs/ecdsafail-challenge) — the repo you are in is a
    clone of it, and the grader runs its `./benchmark.sh` exactly as the platform does.

    The harness calls `point_add::build()`, which must consume four 256-element
    registers — `target_x`, `target_y` (qubits), `offset_x`, `offset_y` (classical
    bits) — and overwrite `(target_x, target_y)` with the affine sum
    `(target_x, target_y) + (offset_x, offset_y)` on secp256k1.

    Score = (average executed Toffoli count per shot) x (peak live qubits).
    **Lower is better.** The platform's current best is ~1.48e9
    (toffoli 1,284,776 x 1,150 qubits). The seed is that exact circuit, so every
    improvement you find is a new world record candidate.

    A run is REJECTED (scores as a failure) if any of these fail across 9024
    Fiat-Shamir-derived random test points: classical correctness, every ancilla
    uncomputed to |0> before free, zero global phase, and forward∘reverse = identity.
    There are no loopholes — skipping uncomputation or leaking phase fails the run.

    **You may only edit files under `src/point_add/`.** Anything else — `src/main.rs`,
    `src/circuit.rs`, `src/sim.rs`, `src/weierstrass_elliptic_curve.rs`, `Cargo.toml`,
    `Cargo.lock`, `rust-toolchain`, `benchmark.sh`, `setup.sh` — is the contract. The
    grader diffs your commit against `main` and fails any attempt that touches a
    non-editable path, because ecdsa.fail would reject it anyway.

    Start by reading `src/point_add/memory/README.md` and `06-research-status.md`:
    previous solvers left a detailed map of the architecture, proven floors, traps,
    and open problems. Treat them as leads, not gospel — verify before relying on them.
    Keep `src/point_add/memory/` up to date with what you learn; it ships with the
    submission and is how the ecdsa.fail solver swarm shares knowledge.

  tips: |
    - Eval timeout is 1800s. A full 9024-shot run takes ~1-3 minutes on a laptop after
      the first build; the grader shares a cargo target dir across evals so only
      `point_add` recompiles.
    - Iterate locally before `coral eval`: `cargo run --release -- --note "what I tried"`
      builds, validates, scores, and appends to results.tsv. `cargo build --release`
      alone catches type errors in seconds.
    - Only a byte-identical ops.bin or a full 9024-shot run counts as evidence — a
      healthy peak/Toffoli probe on a partial run proves nothing (see memory/04-traps.md).
    - The score is a PRODUCT: a 1% qubit cut is worth the same as a 1% Toffoli cut.
      Watch for the exchange-rate trap described in memory/05-qubit-reduction.md —
      freed qubits get re-absorbed unless you also lower the matching target knob.
    - Google's published Pareto points are ~3.0-3.2e9; the seed is already ~2x below
      them. Gains now come from modular-inverse structure, windowed arithmetic,
      carry-lookahead vs ripple trade-offs, measurement-based uncomputation, and
      better ancilla scheduling — not from micro-optimising gate counts by hand.
    - Write `coral eval -m` messages and notes as if for another solver: what you
      changed, the measured toffoli/qubits, and why it did or didn't help.

grader:
  entrypoint: "ecdsa_fail_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  timeout: 1800
  direction: minimize
  args:
    editable_paths: ["src/point_add"]
    base_ref: "main"
    benchmark_command: "bash -lc ./benchmark.sh"
    reference_best: 1477492400        # leaderboard best at bootstrap time; update freely
  parallel:
    max_workers: 1                    # cargo + shared target dir: keep serial
  max_pending_per_agent: 1

agents:
  count: 1
  runtime: pi
  model: deepseek/deepseek-v4-pro

workspace:
  results_dir: "./results"
  repo_path: "./seed"   # populated by ./bootstrap.sh (run `coral start` from this dir)
  setup:
    - "bash -lc 'cargo build --release --locked --offline --bin build_circuit --bin eval_circuit'"

run:
  verbose: false
  ui: false
  session: tmux
