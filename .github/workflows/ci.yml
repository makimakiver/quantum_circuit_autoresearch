name: CI

# This repo is a CORAL harness (Python grader + shell scripts + task.yaml).
# The Rust crate lives in seed/, which is git-ignored and regenerated by
# bootstrap.sh from Layr-Labs/ecdsafail-challenge, so there is nothing for
# cargo to build here. Check what is actually tracked instead.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Grader compiles
        run: python -m py_compile grader/src/ecdsa_fail_grader/*.py
      - name: Shell scripts parse
        run: bash -n bootstrap.sh scripts/submit_attempt.sh
      - name: task.yaml parses
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('task.yaml'))"
